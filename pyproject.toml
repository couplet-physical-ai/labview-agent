[project]
name = "labview-agent"
version = "0.1.0"
description = "Stand-side bridge: LabVIEW telemetry out to RabbitMQ, policy-filtered command proposals back into the VI"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pika~=1.3",
]

[dependency-groups]
dev = [
    "ruff~=0.15",
    "pytest~=9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
